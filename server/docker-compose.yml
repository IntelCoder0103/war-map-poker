# War-Map Poker server + MongoDB. See README.md for the full guide.
#   docker compose build                    -> build the images (once, needs internet)
#   docker compose up -d                    -> MongoDB + server on http://localhost:3000 (runs offline after the build)
#   docker compose logs -f server           -> follow the server log
#   docker compose run --rm test            -> all tests
#   docker compose run --rm bots            -> 3 bots join the Recruit room
# Versions follow the project's requirements: Node 16.2, MongoDB 4.2.
services:
  mongo:
    image: mongo:4.2
    restart: unless-stopped
    ports: ["127.0.0.1:27017:27017"]  # this machine only: no database password is set
    volumes: [mongo42-data:/data/db]

  server:
    build: { context: ., target: app }
    image: war-map-poker-server
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017/warpoker
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
    ports: ["${SERVER_PORT:-3000}:3000"]
    volumes: ["./config.json:/app/config.json:ro"]  # edit config.json, then: docker compose restart server
    depends_on: [mongo]

  test:
    build: { context: ., target: dev }
    image: war-map-poker-server-dev
    command: npx jest --runInBand
    environment:
      MONGO_URL: mongodb://mongo:27017/warpoker_test
    volumes: [./:/app, /app/node_modules]  # your current code, with the image's node_modules
    depends_on: [mongo]

  bots:
    build: { context: ., target: dev }
    image: war-map-poker-server-dev
    command: node tools/bots.js --url http://server:3000 --level recruit --count 3
    volumes: [./:/app, /app/node_modules]
    depends_on: [server]
    profiles: [tools]  # not started by "up"; run it with "docker compose run --rm bots"

volumes:
  mongo42-data:
